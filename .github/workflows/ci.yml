name: tap guard

# The formula is ONE assertion: one url and one sha256, because 0.3.x publishes one bundle for
# every platform instead of eight per-target bare binaries (0.2.x). `brew audit` checks the
# formula text, but only a real install catches a 404 or a wrong hash - which is what breaks
# when artifacts move to their final host. So: audit always, install for real as soon as the
# base URL serves 200.
#
# What this file learned the hard way, all measured:
#   * GitHub ubuntu runners do NOT ship Homebrew - hence setup-homebrew below.
#   * on Homebrew 7 a third-party tap is not loadable until it is trusted, and
#     `brew tap` alone does not do it - hence the explicit `brew trust`.
#   * `macos-13` was dropped: it never scheduled, and Homebrew itself warns that
#     GitHub is retiring macOS Intel runners. `macos-15-intel` is the current
#     Intel label.
#   * the install steps use the FULLY QUALIFIED name on purpose: a bare
#     `brew install loom` resolves to the CASK named loom (the screen
#     recorder, 0.379.4) and never reaches this formula. See README.md.
#   * THE PROBE HAS TO FOLLOW THE FORMULA (measured 2026-10-28). It used to curl a hard-coded
#     `loom-0.1.0-x86_64-unknown-linux-gnu`, a name no release after 0.1.0 publishes; with
#     BASE_URL at /v0.2.5 that URL 404s, so `live` was ALWAYS false and the install job
#     silently never ran. It now reads the formula's own `url` line and substitutes BASE_URL
#     into it, so it tracks whatever the formula points at.
#   * `deno` HAS NO INTEL-MACOS BOTTLE, and there will not be one: homebrew-core publishes
#     deno bottles for arm64 macOS (sequoia/tahoe/golden_gate), arm64 Linux and x86_64 Linux
#     only, because Homebrew retired Intel x86_64 in September 2026. On `macos-15-intel` a
#     plain `brew install` therefore builds llvm + rust + cmake + deno FROM SOURCE - hours -
#     and the job would time out. That one leg installs Deno with Deno's own installer and
#     passes `--ignore-dependencies`, which still exercises everything this tap owns: the URL,
#     the sha256, the unpacked layout, the symlinks, both command names and one real repl.
#     `brew test` is skipped there for the same reason: it refuses to run when a dependency
#     is not installed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAP: ${{ github.repository_owner }}/tap
  REPO: https://github.com/${{ github.repository }}

jobs:
  audit:
    name: brew audit --strict
    runs-on: ubuntu-latest
    steps:
      - name: Install Homebrew if the runner has none
        run: |
          if command -v brew >/dev/null 2>&1; then brew --version; exit 0; fi
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Tap this repository
        run: brew tap "$TAP" "$REPO"
      - name: Audit the formula text
        run: brew audit --strict "$TAP/loom"

  probe:
    name: are the artifacts published yet
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.probe.outputs.live }}
    steps:
      - uses: actions/checkout@v4
      - name: Anonymous GET on the url the formula points at
        id: probe
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^  BASE_URL = "\([^"]*\)".*$/\1/p' Formula/loom.rb)
          echo "BASE_URL=$BASE"
          # THE FORMULA'S OWN url LINE, with the one interpolated constant put back. Reading it
          # instead of restating a file name is the whole point: the version lives in that file
          # name, so a probe that names a file itself goes stale at the next release - and did.
          URL=$(sed -n 's/^  url "\(.*\)"$/\1/p' Formula/loom.rb | head -n 1)
          URL=${URL//\#\{BASE_URL\}/$BASE}
          echo "probe: $URL"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "$URL" || true)
          echo "anonymous GET -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=artifacts not published yet::the formula's url is still unreachable, so the real install is skipped. It starts running by itself the moment that URL serves 200."
          fi

  install:
    name: real brew install on ${{ matrix.os }}
    needs: probe
    if: needs.probe.outputs.live == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # deno bottles exist for these three; the fourth is the platform Homebrew retired.
          - os: ubuntu-latest      # x86_64 Linux
            brew_deps: true
          - os: ubuntu-24.04-arm    # arm64 Linux
            brew_deps: true
          - os: macos-14            # arm64 macOS
            brew_deps: true
          - os: macos-15-intel      # Intel macOS - no deno bottle, see the header
            brew_deps: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Homebrew if the runner has none
        run: |
          if command -v brew >/dev/null 2>&1; then brew --version; exit 0; fi
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Tap this repository and trust it
        run: |
          brew tap "$TAP" "$REPO"
          brew trust "$TAP"
      - name: Deno from Deno's installer - the platform brew cannot bottle it on
        if: matrix.brew_deps == false
        run: |
          set -euo pipefail
          # v2.9.7 is the floor the bundle's own launcher accepts (`>= 2.9.7, < 3.0`), which is
          # the version the release is built against and ships in the bundle's DENO_VERSION.
          curl -fsSL https://deno.land/install.sh | sh -s v2.9.7
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Install for real - catches a 404 or a bad sha256, which audit cannot
        run: |
          set -euo pipefail
          if [ "${{ matrix.brew_deps }}" = "true" ]; then
            brew install --formula "$TAP/loom"
          else
            brew install --formula --ignore-dependencies "$TAP/loom"
          fi
      - name: Both commands the release promises
        run: |
          set -euo pipefail
          command -v loom
          command -v loomd
      - name: The version is the formula own, not some other loom on PATH
        run: |
          set -euo pipefail
          WANT=$(brew info --json=v2 --formula "$TAP/loom" \
            | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["versions"]["stable"]')
          GOT=$(loom --version)
          echo "formula=$WANT binary=$GOT"
          [ "$WANT" = "$GOT" ]
      - name: The formula own test block
        if: matrix.brew_deps == true
        run: brew test "$TAP/loom"
      - name: The same three assertions, on the leg where brew test cannot run
        if: matrix.brew_deps == false
        run: |
          set -euo pipefail
          WANT=$(brew info --json=v2 --formula "$TAP/loom" \
            | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["versions"]["stable"]')
          [ "$(loom --version)" = "$WANT" ]
          [ "$(loomd --version)" = "$WANT" ]
          # The dependency's whole point: a repl is a Deno child, and --doctor exits with that
          # row's answer. It needs no model and no network.
          loom --doctor | grep -F "RUNTIME   can this build run a repl here: YES"
      - name: Uninstall leaves nothing behind
        run: |
          set -euo pipefail
          brew uninstall --formula "$TAP/loom"
          # `hash -r` is not optional: bash caches a command path once it has
          # been run, so a bare `command -v loom` still answers with the
          # deleted path and reads as a failed uninstall that is not one.
          hash -r
          if command -v loom >/dev/null 2>&1; then echo "loom still on PATH"; exit 1; fi
          test ! -e "$(brew --prefix)/bin/loom"
